pdf:
  dpi: 200

input:
  jawaban_dir: data/input/jawaban
  # Source TeX for CLI ingest-kunci → standards/.../solutions (enumerate+align+HP slice).
  kunci_jawaban_dir: data/input/kunci_jawaban

output:
  # Per PDF: <root_dir>/<nama_pdf>/{pages,crops,recognition,questions,report.*,summary.csv}
  root_dir: data/output

ollama:
  base_url: "http://localhost:11434"
  # Cloud via local Ollama proxy (sign in required). Images leave the machine.
  vision_model: "gemma4:31b-cloud"
  reasoning_model: "gpt-oss:120b-cloud"
  timeout_seconds: 180
  max_retries: 2

recognition:
  # Steps below this confidence are flagged in the question.json review prompt.
  review_min_confidence: 0.8
  ink:
    threshold: 200
    merge_gap_ratio: 0.018
    min_block_height_ratio: 0.03
    min_row_ink_ratio: 0.002
    header_fraction: 0.08
    column_valley_ratio: 0.15
    margin_ratio: 0.02

grading:
  # Ingest + grading per topic: <standards_root>/topik_<bab> (1.5 → topik_1, 2 → topik_2).
  standards_root: data/output/standards
  topic_id: "1.5"

report:
  # report.tex → report.pdf right after grading (failure only warns).
  pdf:
    enabled: true
    # Empty = auto-detect (PATH, then standard MiKTeX / TeX Live); env PDFLATEX_PATH overrides.
    pdflatex_path: ""
    passes: 2
    timeout_seconds: 120
